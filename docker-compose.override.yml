# Local development overrides.
# Exposes service ports directly, removes Caddy, and enables hot-reload.
# Usage: docker compose up  (this file is applied automatically)

services:
  db:
    ports:
      - "5432:5432"

  ollama:
    ports:
      - "11434:11434"

  api:
    build:
      context: ./api
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  bot:
    volumes:
      - ./bot:/app

  # Disable caddy in local dev — access services directly via ports above
  caddy:
    profiles:
      - production
